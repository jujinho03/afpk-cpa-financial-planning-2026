<title id="title">C의 장기 지표가 가장 높지만 B와의 차이는 654.5만 원이며 첫 급여 일정에 의존한다</title>
<desc id="desc">초기 가용현금을 포함한 60개월 가중 할인 순현금흐름. C 6,716.7만원, B 6,062.2만원, D 5,853.5만원, A 5,259.2만원. A는 단기 안전자금 제약을 위반한다.</desc>
