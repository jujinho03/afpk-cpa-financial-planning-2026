<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 514" width="1280" height="514" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">합격해도 끝나지 않는다 — 분석의 세 단계</title>
<desc id="desc">가상 고객의 18개월 유동성, 60개월 조건부 현금흐름, 재현 가능한 근거를 연결한 프로젝트 개요.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}.number{font-family:Arial,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1280" height="514" rx="20" fill="#142638"/>
<text x="48" y="48" font-size="15" fill="#9BC6CF" font-weight="700" text-anchor="start">AFPK YOUNG PLANNER CHALLENGE 2026</text>
<text x="48" y="112" font-size="43" fill="#FFFFFF" font-weight="700" text-anchor="start">합격해도 끝나지 않는다</text>
<text x="48" y="154" font-size="22" fill="#D5E2EC" font-weight="400" text-anchor="start">CPA 2차 유예생의 합격·수습·첫 급여 사이, 소득 공백을 견디는 재무설계</text>
<rect x="48" y="183" width="1184" height="1" rx="0" fill="#355064"/>
<rect x="48" y="212" width="376" height="218" rx="12" fill="#20394D"/>
<text x="70" y="247" font-size="16" fill="#74CBC3" font-weight="700" text-anchor="start" class="number">01</text>
<text x="70" y="283" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">18개월 지급능력</text>
<text x="70" y="319" font-size="17" fill="#C4D5E2" font-weight="400" text-anchor="start">현금이 버티는가?</text>
<text x="70" y="365" font-size="19" fill="#74CBC3" font-weight="700" text-anchor="start">A/U 안전자금 이탈 2027.10</text>
<text x="70" y="399" font-size="16" fill="#C4D5E2" font-weight="400" text-anchor="start">미충당액 발생 2028.01</text>
<rect x="452" y="212" width="376" height="218" rx="12" fill="#20394D"/>
<text x="474" y="247" font-size="16" fill="#9FBDE4" font-weight="700" text-anchor="start" class="number">02</text>
<text x="474" y="283" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">60개월 조건부 비교</text>
<text x="474" y="319" font-size="17" fill="#C4D5E2" font-weight="400" text-anchor="start">어떤 경로가 유리한가?</text>
<text x="474" y="365" font-size="19" fill="#9FBDE4" font-weight="700" text-anchor="start">C 6,717만 원 · B 6,062만 원</text>
<text x="474" y="399" font-size="16" fill="#C4D5E2" font-weight="400" text-anchor="start">같은 기간·할인율의 현금흐름 현가</text>
<rect x="856" y="212" width="376" height="218" rx="12" fill="#20394D"/>
<text x="878" y="247" font-size="16" fill="#E2BD7E" font-weight="700" text-anchor="start" class="number">03</text>
<text x="878" y="283" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start">재현 가능한 근거</text>
<text x="878" y="319" font-size="17" fill="#C4D5E2" font-weight="400" text-anchor="start">결과를 다시 확인할 수 있는가?</text>
<text x="878" y="365" font-size="19" fill="#E2BD7E" font-weight="700" text-anchor="start">12개 경로 · 720개 월별 행</text>
<text x="878" y="399" font-size="16" fill="#C4D5E2" font-weight="400" text-anchor="start">가정 원장 → 코드 → 표 → 회귀검증</text>
<text x="48" y="474" font-size="17" fill="#B5C7D7" font-weight="400" text-anchor="start">가상 고객·가정값 기반 계산  |  개인 합격확률 예측이나 확정 수익이 아닙니다.</text>
</svg>
