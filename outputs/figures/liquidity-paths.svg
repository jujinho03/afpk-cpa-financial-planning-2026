<text x="56" y="98" font-size="30" fill="#111111" font-weight="700" text-anchor="start">A는 2027.10에 안전자금 하한을 밑돌고, 2028.01부터 미충당이 생긴다</text>
<text x="56" y="134" font-size="17" fill="#6E6E6E" font-weight="400" text-anchor="start">월말 잔액 · U: 합격 후 수습 미확보 + 전략별 대체 취업 경로 · 2026.12~2028.05 · 단위: 만원</text>
