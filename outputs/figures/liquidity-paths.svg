<title id="title">18개월 유동성 — A는 안전자금 이탈 이후 미충당액이 발생</title>
<desc id="desc">2026년12월부터 2028년5월까지 A/U B/U C/U D/U의 월말 원시 잔액과 안전자금 하한. 음수는 미충당액으로 표시하며 0에서 자르지 않는다. U는 합격 후 수습 미확보 상태이고 대체 취업 시점은 전략마다 다르다.</desc>
