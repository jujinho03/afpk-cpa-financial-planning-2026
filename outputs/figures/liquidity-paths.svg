<text x="48" y="90" font-size="31" fill="#142638" font-weight="700" text-anchor="start">장기 가치보다 먼저, 생활을 유지할 수 있는가</text>
<text x="48" y="125" font-size="18" fill="#637487" font-weight="400" text-anchor="start">18개월 월말 잔액 · U: 합격 후 수습 미확보 + 전략별 대체 취업 경로 · 단위: 만원</text>
