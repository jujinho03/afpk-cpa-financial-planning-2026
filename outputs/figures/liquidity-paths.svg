<text x="48" y="623" font-size="16" fill="#637487" font-weight="400" text-anchor="start">가상 고객·고정 소득경로의 월말 계산입니다. 실제 채용·급여를 보장하지 않으며 월중 지급일까지 검증한 결과는 아닙니다.</text>
